openapi: 3.1.0
info:
  title: mastr-solar API
  version: "2026.06.02"
  description: |
    API für mastr-solar (PV-Akquise-Tool für Repowering DE).
    Authentifizierung primär via API-Token im Bearer-Header.
    Vollständige Doku: `/docs/API.md` (DE), `/docs/API.en.md` (EN), `/docs/API.fr.md` (FR).
  contact:
    name: mastr-solar admin
    url: https://mastr-solar.51.195.86.119.nip.io
  license:
    name: Proprietary

servers:
  - url: https://mastr-solar.51.195.86.119.nip.io
    description: Production
  - url: https://mastr-solar.51.195.86.119.nip.io/api/v1
    description: Production v1 alias

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: Auth
    description: Authentifizierung und eigenes Profil
  - name: Anlagen
    description: PV-Anlagen (Stammdaten + Detail)
  - name: Kunden
    description: Betreiber / Customers
  - name: Reminders
    description: Wiedervorlagen
  - name: Termine
    description: Kalendertermine
  - name: Dashboard
    description: Aggregate Stats
  - name: Health
    description: Liveness + Metrics
  - name: Admin
    description: Token + System (nur Cookie-Auth, nicht über API-Token)

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness check (public)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  time: { type: string, format: date-time }

  /api/healthz:
    get:
      tags: [Health]
      summary: Deep health check (public)
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, degraded] }
                  checks:
                    type: object
                    properties:
                      db: { type: string }
                      anlagen_count: { type: integer }
                      open_bugs: { type: integer }
                      memory_rss_mb: { type: integer }
                  time: { type: string, format: date-time }
        '503':
          description: Degraded

  /api/metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics (public, text/plain)
      security: []
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Browser-Login (set cookie). External systems use Bearer instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                totp_code: { type: string, description: "6-stellig falls 2FA aktiv" }
      responses:
        '200':
          description: Login erfolgreich, Cookie gesetzt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Falsche Credentials
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Aktuell eingeloggten User abrufen
      responses:
        '200':
          description: User-Objekt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me/profile:
    get:
      tags: [Auth]
      summary: Eigenes Profil + Voreinstellungen
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
    put:
      tags: [Auth]
      summary: Profil + Voreinstellungen aktualisieren (Whitelist)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean } }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/me/password:
    post:
      tags: [Auth]
      summary: Eigenes Passwort ändern (mit current_password-Check)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 6 }
      responses:
        '200': { description: Passwort geändert }
        '403': { description: Aktuelles Passwort falsch }

  /api/anlagen:
    get:
      tags: [Anlagen]
      summary: Anlagen-Liste (gefiltert + paginiert)
      description: |
        **API-Token-Clients sehen nur Anlagen mit `owner_id IS NOT NULL`** (= bearbeitete).
        Cookie-Auth sieht alles.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: bundesland, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [neu, kontaktiert, bearbeitet, interessiert, nicht_interessiert, abgeschlossen] } }
        - { name: mit_kontakt, in: query, schema: { type: string, enum: [ja, nein] } }
        - { name: leistung_min, in: query, schema: { type: number } }
        - { name: leistung_max, in: query, schema: { type: number } }
        - { name: datum_von, in: query, schema: { type: string, format: date } }
        - { name: datum_bis, in: query, schema: { type: string, format: date } }
        - { name: owner, in: query, schema: { type: string }, description: "me | unassigned | <user-id>" }
        - { name: sortBy, in: query, schema: { type: string, enum: [nettonennleistung, inbetriebnahme, name, ort, bundesland, lead_score] } }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: after, in: query, schema: { type: integer }, description: "Cursor-Pagination (alternativ zu page): liefere IDs > after" }
      responses:
        '200':
          description: Page mit Anlagen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Anlage' }
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/anlagen/{id}:
    get:
      tags: [Anlagen]
      summary: Anlage-Detail + Sub-Ressourcen (notizen, termine, reminders, economics)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: module_wp, in: query, schema: { type: integer, minimum: 400, maximum: 900 }, description: "Modul-Wp Override für Repowering-Kalk" }
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnlageDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Anlagen]
      summary: Anlage aktualisieren (Whitelist)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, schema: { type: string }, description: "Dedup über 24h" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnlageUpdate'
      responses:
        '200': { description: Erfolg }
        '403':
          description: owner_id-Change nicht erlaubt (nur Owner oder Admin)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/anlagen/{id}/related:
    get:
      tags: [Anlagen]
      summary: Andere Anlagen desselben Betreibers
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Anlage' }

  /api/anlagen/{id}/neighbors:
    get:
      tags: [Anlagen]
      summary: Anlagen im Umkreis (Haversine)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: radius, in: query, schema: { type: integer, default: 1, maximum: 20 }, description: "Radius in km" }
      responses:
        '200':
          description: Liste mit distance_m
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Anlage'
                    - type: object
                      properties:
                        distance_m: { type: integer }
                        same_betreiber: { type: integer, enum: [0, 1] }

  /api/anlagen/{id}/notizen:
    post:
      tags: [Anlagen]
      summary: Notiz an Anlage anlegen (claimt Owner falls leer)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                scope: { type: string, enum: [anlage, betreiber], default: anlage }
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: integer }

  /api/kunden:
    get:
      tags: [Kunden]
      summary: Kunden-Liste (aggregiert)
      description: API-Token sieht nur Kunden mit ≥ 1 bearbeiteten Anlage.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000 } }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Kunde' }

  /api/kunden/{mastr}:
    get:
      tags: [Kunden]
      summary: Kunden-Detail
      parameters: [{ name: mastr, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Detail mit anlagen + notizen + reminders + calls
          content:
            application/json:
              schema:
                type: object
                properties:
                  betreiber: { $ref: '#/components/schemas/Betreiber' }
                  anlagen:   { type: array, items: { $ref: '#/components/schemas/Anlage' } }
                  notizen:   { type: array, items: { $ref: '#/components/schemas/Notiz' } }
                  reminders: { type: array, items: { $ref: '#/components/schemas/Reminder' } }

  /api/kunden/{mastr}/notizen:
    post:
      tags: [Kunden]
      summary: Kunden-Notiz (gilt für alle Anlagen des Betreibers)
      parameters:
        - { name: mastr, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        '200': { description: Erfolg }

  /api/reminders:
    get:
      tags: [Reminders]
      summary: Reminders-Liste
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, done, snoozed, all], default: pending } }
        - { name: betreiber_mastr, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reminder' }
    post:
      tags: [Reminders]
      summary: Reminder anlegen (claimt Owner)
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [betreiber_mastr, due_at]
              properties:
                betreiber_mastr: { type: string }
                due_at: { type: string, format: date-time }
                note: { type: string }
                owner_user_id: { type: integer }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }

  /api/reminders/{id}:
    patch:
      tags: [Reminders]
      summary: Reminder updaten / done / snooze
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [done, snooze] }
                until: { type: string, format: date-time, description: "Bei action=snooze" }
                due_at: { type: string, format: date-time }
                note: { type: string }
                owner_user_id: { type: integer, nullable: true }
      responses:
        '200': { description: Erfolg }
    delete:
      tags: [Reminders]
      summary: Reminder löschen
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Erfolg }

  /api/termine:
    get:
      tags: [Termine]
      summary: Termine im Zeitraum
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Termin' }
    post:
      tags: [Termine]
      summary: Termin anlegen (sendet ICS an attendee)
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerminCreate' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Termin' }

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Aggregierte Dashboard-Daten
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  quick_stats: { type: object }
                  reminders_today: { type: array }
                  termine_today: { type: array }
                  recent_notifications: { type: array }
                  recent_activities: { type: array }
                  top_leads: { type: array }
                  funnel: { type: array }

  /api/map/markers:
    get:
      tags: [Anlagen]
      summary: Map-Marker für Bounding-Box
      parameters:
        - { name: bbox, in: query, schema: { type: string }, description: "south,west,north,east" }
        - { name: status, in: query, schema: { type: string } }
        - { name: min_score, in: query, schema: { type: integer } }
        - { name: owner, in: query, schema: { type: string } }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MapMarker' }

  # ============= Activity-Verlauf =============
  /api/me/activity:
    get:
      tags: [Auth]
      summary: Eigener Aktivitäts-Verlauf inkl. ausgehender & eingehender @-Mentions
      description: |
        Kombiniert eigene Activities (status_change, owner_change, note_added,
        email_sent, termin_created, comment_added, kontakt_updated) mit
        Mention-Notifications (ausgehend = wo ich jemanden markiert habe,
        eingehend = wo mich jemand markiert hat).
        Maximal 500 Einträge pro Quelle vor der Sortierung; Pagination via limit/offset.
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [all, activity, mention, incoming], default: all }, description: "Filter: alle / nur eigene Aktionen / nur ausgehende Mentions / nur eingehende Mentions" }
        - { in: query, name: type, schema: { type: string }, description: "Activity-Typ (status_change, note_added, ...). Bei kind=mention/incoming ignoriert." }
        - { in: query, name: q,    schema: { type: string }, description: "Volltext in Beschreibung / Anlagen-Adresse / Mention-Username." }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to,   schema: { type: string, format: date-time } }
        - { in: query, name: limit,  schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Verlauf-Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:  { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }
                  total:  { type: integer }
                  limit:  { type: integer }
                  offset: { type: integer }

  # ============= API-Token-Rotation =============
  /api/admin/api-tokens/{id}/rotate:
    post:
      tags: [Admin]
      summary: API-Token rotieren (alten ersetzen, optional mit Grace-Period)
      description: |
        Erstellt einen NEUEN Token mit gleichem Namen/Scope/Expiry und revoked den alten.
        Mit `grace_minutes > 0` bleibt der alte Token für N Minuten weiter gültig
        (Soft-Rotation für graduellen Client-Umstieg). Default = 0 (Hard-Rotation).
        Klartext-Token wird NUR HIER zurückgegeben.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_minutes: { type: integer, minimum: 0, maximum: 10080, default: 0, description: "0 = sofort tot, max = 7 Tage." }
      responses:
        '200':
          description: Rotation erfolgreich
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiToken'
                  - type: object
                    properties:
                      token:           { type: string, example: "msolar_aBcDeFg...", description: "Klartext NEUER Token — nur HIER einmalig." }
                      old_id:          { type: integer }
                      old_grace_until: { type: string, format: date-time, nullable: true, description: "Falls grace_minutes>0: bis wann alter Token noch gültig." }
        '400': { description: "Token bereits widerrufen / nicht gefunden" }

  # ============= Webhooks (Admin) =============
  /api/admin/webhooks:
    get:
      tags: [Admin]
      summary: Alle Webhooks listen
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:    { type: array, items: { $ref: '#/components/schemas/Webhook' } }
                  all_events:  { type: array, items: { type: string }, description: "Alle bekannten Event-Typen." }
    post:
      tags: [Admin]
      summary: Neuen Webhook anlegen
      description: |
        Liefert das `secret` einmalig zurück — danach nicht mehr lesbar.
        Mit dem secret signierst du eingehende Calls per HMAC-SHA256 (`X-Webhook-Signature`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:         { type: string, format: uri, example: "https://example.com/webhook/mastr-solar" }
                events:      { type: array, items: { $ref: '#/components/schemas/WebhookEventName' }, minItems: 1 }
                description: { type: string, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }

  /api/admin/webhooks/{id}:
    put:
      tags: [Admin]
      summary: Webhook bearbeiten (URL / Events / enabled / description)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:         { type: string, format: uri }
                events:      { type: array, items: { $ref: '#/components/schemas/WebhookEventName' } }
                enabled:     { type: boolean }
                description: { type: string, nullable: true }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } }
    delete:
      tags: [Admin]
      summary: Webhook löschen
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }

  /api/admin/webhooks/{id}/test:
    post:
      tags: [Admin]
      summary: Manueller Test-Ping an den Webhook
      description: Sendet ein `webhook.test`-Event und gibt Status sofort zurück.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, description: HTTP-Status der Test-Anfrage }
                  ok:     { type: boolean }
                  body:   { type: string, description: "Bis zu 2000 Zeichen Response-Body." }
                  error:  { type: string, nullable: true }

  /api/admin/webhooks/{id}/deliveries:
    get:
      tags: [Admin]
      summary: Letzte Delivery-Versuche für diesen Webhook
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "msolar_<43chars>"
      description: |
        API-Token, vom Admin im UI erstellt.
        Scopes: `read` (nur GET), `write` (GET+POST/PUT/PATCH/DELETE auf non-admin), `full` (alles ausser Admin-Endpoints).
        **Admin-Endpoints sind für ALLE Token-Scopes gesperrt** — auch `full`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Browser-Session-Cookie (gesetzt nach /api/auth/login).

  responses:
    BadRequest:
      description: Eingabe ungültig
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Nicht authentifiziert
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authentifiziert, aber keine Berechtigung
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource nicht gefunden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate-Limit ueberschritten (max 10 req/s, 600 req/min pro Token)
      headers:
        Retry-After: { schema: { type: integer }, description: "Sekunden bis Retry" }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, code, message]
      properties:
        error: { type: string, description: "Menschenlesbare Fehlermeldung (Legacy-Feld)" }
        code:
          type: string
          enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, VALIDATION_FAILED, RATE_LIMITED, ADMIN_NOT_API, ADMIN_REQUIRED, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
        message: { type: string }
        retry_after: { type: integer, description: "Nur bei RATE_LIMITED" }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }
        next_cursor: { type: integer, description: "Nur bei Cursor-Mode: ID des letzten Eintrags" }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        color: { type: string }
        is_admin: { type: integer, enum: [0, 1] }
        _api_token: { type: boolean, description: "true wenn via Bearer-Token authentifiziert" }
        _api_scope: { type: string, enum: [read, write, full], nullable: true }

    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            phone: { type: string, nullable: true }
            bio: { type: string, nullable: true }
            pref_default_tab: { type: string }
            pref_anlagen_sort: { type: string }
            pref_map_marker_mode: { type: string, enum: [status, lead_score, owner] }
            pref_reminder_snooze_min: { type: integer }
            pref_quiet_hours_start: { type: string, nullable: true, pattern: "^\\d{2}:\\d{2}$" }
            pref_quiet_hours_end: { type: string, nullable: true, pattern: "^\\d{2}:\\d{2}$" }
            pref_locale: { type: string }

    ProfileUpdate:
      type: object
      properties:
        display_name: { type: string }
        email: { type: string, format: email }
        color: { type: string }
        phone: { type: string }
        bio: { type: string }
        pref_default_tab: { type: string, enum: [dashboard, anlagen, karte, kunden, settings, profile] }
        pref_anlagen_sort: { type: string }
        pref_map_marker_mode: { type: string, enum: [status, lead_score, owner] }
        pref_reminder_snooze_min: { type: integer, minimum: 5, maximum: 10080 }
        pref_quiet_hours_start: { type: string, nullable: true }
        pref_quiet_hours_end: { type: string, nullable: true }
        pref_locale: { type: string }

    Anlage:
      type: object
      properties:
        id: { type: integer }
        mastr_nummer: { type: string }
        name: { type: string, nullable: true }
        betreiber_name: { type: string, nullable: true }
        betreiber_mastr: { type: string, nullable: true }
        strasse: { type: string, nullable: true }
        plz: { type: string, nullable: true }
        ort: { type: string, nullable: true }
        bundesland: { type: string, nullable: true }
        landkreis: { type: string, nullable: true }
        breitengrad: { type: number, format: float, nullable: true }
        laengengrad: { type: number, format: float, nullable: true }
        nettonennleistung: { type: number, format: float, description: "kWp" }
        bruttoleistung: { type: number, format: float, nullable: true }
        anzahl_module: { type: integer, nullable: true }
        inbetriebnahme: { type: string, format: date, nullable: true }
        energietraeger: { type: string, nullable: true }
        anlagentyp: { type: string, nullable: true }
        hauptausrichtung: { type: string, nullable: true }
        hauptausrichtung_neigungswinkel: { type: string, nullable: true }
        status: { type: string, enum: [neu, kontaktiert, bearbeitet, interessiert, nicht_interessiert, abgeschlossen] }
        lead_score: { type: integer }
        owner_id: { type: integer, nullable: true }
        owner_username: { type: string, nullable: true }
        kontakt_email: { type: string, format: email, nullable: true }
        kontakt_telefon: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AnlageDetail:
      allOf:
        - $ref: '#/components/schemas/Anlage'
        - type: object
          properties:
            notizen_liste: { type: array, items: { $ref: '#/components/schemas/Notiz' } }
            sent_emails: { type: array }
            termine: { type: array, items: { $ref: '#/components/schemas/Termin' } }
            activities: { type: array }
            messages: { type: array }
            calls: { type: array }
            related_anlagen: { type: array, items: { $ref: '#/components/schemas/Anlage' } }
            reminders: { type: array, items: { $ref: '#/components/schemas/Reminder' } }
            economics:
              type: object
              properties:
                specific_yield_kwh_per_kwp: { type: number }
                annual_kwh: { type: number }
                eeg_rate_ct_per_kwh: { type: number }
                annual_revenue_eur: { type: number }
                repowering: { type: object }
                storage: { type: object }

    AnlageUpdate:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [neu, kontaktiert, bearbeitet, interessiert, nicht_interessiert, abgeschlossen] }
        owner_id: { type: integer, nullable: true, description: "Nur Owner oder Admin darf das aendern" }
        strasse: { type: string }
        plz: { type: string }
        ort: { type: string }
        bundesland: { type: string }
        breitengrad: { type: number }
        laengengrad: { type: number }
        nettonennleistung: { type: number }
        anzahl_module: { type: integer }
        inbetriebnahme: { type: string, format: date }

    Kunde:
      type: object
      properties:
        mastr_nummer: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        telefon: { type: string, nullable: true }
        betreiber_ort: { type: string, nullable: true }
        betreiber_plz: { type: string, nullable: true }
        anlagen_count: { type: integer }
        gesamt_leistung_kw: { type: number }
        letzte_aktivitaet: { type: string, format: date-time, nullable: true }
        offene_reminders: { type: integer }

    Betreiber:
      type: object
      properties:
        id: { type: integer }
        mastr_nummer: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        website: { type: string, nullable: true }
        strasse: { type: string, nullable: true }
        plz: { type: string, nullable: true }
        ort: { type: string, nullable: true }
        rechtsform: { type: string, nullable: true }

    Notiz:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        scope: { type: string, enum: [anlage, betreiber] }
        anlage_id: { type: integer, nullable: true }
        betreiber_mastr: { type: string, nullable: true }
        user_id: { type: integer }
        user_username: { type: string }
        user_display_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Reminder:
      type: object
      properties:
        id: { type: integer }
        betreiber_mastr: { type: string }
        betreiber_name: { type: string, nullable: true }
        due_at: { type: string, format: date-time }
        note: { type: string, nullable: true }
        status: { type: string, enum: [pending, done, snoozed] }
        owner_user_id: { type: integer, nullable: true }
        owner_username: { type: string, nullable: true }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        snoozed_until: { type: string, format: date-time, nullable: true }

    Termin:
      type: object
      properties:
        id: { type: integer }
        anlage_id: { type: integer, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        start_ts: { type: integer, description: "Unix-Timestamp (ms)" }
        end_ts: { type: integer }
        attendee_email: { type: string, nullable: true }
        attendee_name: { type: string, nullable: true }
        status: { type: string, enum: [confirmed, cancelled] }
        rsvp_status: { type: string, nullable: true, enum: [accepted, declined, pending] }

    TerminCreate:
      type: object
      required: [title, start_ts, end_ts]
      properties:
        anlage_id: { type: integer }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        start_ts: { type: string, format: date-time }
        end_ts: { type: string, format: date-time }
        attendee_email: { type: string, format: email }
        attendee_name: { type: string }

    MapMarker:
      type: object
      properties:
        id: { type: integer }
        mastr_nummer: { type: string }
        name: { type: string, nullable: true }
        ort: { type: string, nullable: true }
        bundesland: { type: string, nullable: true }
        status: { type: string }
        nettonennleistung: { type: number }
        lead_score: { type: integer }
        lat: { type: number }
        lng: { type: number }

    # ==== Activity-Verlauf ====
    ActivityItem:
      type: object
      properties:
        id:               { type: string, description: "Prefix 'a' = Activity, 'm' = ausgehende Mention, 'i' = eingehende Mention." }
        kind:             { type: string, enum: [activity, mention, incoming] }
        type:             { type: string, description: "Activity-Typ (status_change, note_added, comment_added, ...) bzw. 'mention' / 'comment'." }
        description:      { type: string }
        metadata:         { type: object, nullable: true, description: "Bei incoming-Mentions: { read: bool, from_user_id: int }." }
        anlage_id:        { type: integer, nullable: true }
        anlage_label:     { type: string, nullable: true }
        anlage_adresse:   { type: string, nullable: true }
        target_user_id:   { type: integer, nullable: true, description: "Nur bei kind=mention (wen ich markiert habe)." }
        target_user_name: { type: string, nullable: true }
        from_user_id:     { type: integer, nullable: true, description: "Nur bei kind=incoming (wer mich markiert hat)." }
        from_user_name:   { type: string, nullable: true }
        created_at:       { type: string, format: date-time }

    # ==== API-Token (vorhandenes Schema ergaenzt — kann redundant zum Bestehenden sein) ====
    ApiToken:
      type: object
      properties:
        id:              { type: integer }
        name:            { type: string }
        token_prefix:    { type: string, example: "msolar_aBcDeFg" }
        scope:           { type: string, enum: [read, write, full] }
        created_by:      { type: integer }
        created_at:      { type: string, format: date-time }
        expires_at:      { type: string, format: date-time, nullable: true }
        last_used_at:    { type: string, format: date-time, nullable: true }
        last_used_ip:    { type: string, nullable: true }
        request_count:   { type: integer }
        revoked_at:      { type: string, format: date-time, nullable: true }
        revoked_by:      { type: integer, nullable: true }

    # ==== Webhooks ====
    WebhookEventName:
      type: string
      enum:
        - lead.created
        - anfrage.received
        - anlage.status_changed
        - anlage.owner_changed
        - mention.created
        - termin.created
        - reminder.due
      description: |
        Alle ausgehenden Event-Typen. Subscriber erhalten ein POST mit Body
        `{ event, timestamp, delivery_id, data }`.

    Webhook:
      type: object
      properties:
        id:               { type: integer }
        url:              { type: string, format: uri }
        events:           { type: array, items: { $ref: '#/components/schemas/WebhookEventName' } }
        secret:           { type: string, description: "Nur beim POST /webhooks Response gefuellt. Format whsec_..." }
        enabled:          { type: integer, enum: [0, 1] }
        description:      { type: string, nullable: true }
        created_by:       { type: integer }
        created_at:       { type: string, format: date-time }
        last_status:      { type: integer, nullable: true }
        last_delivery_at: { type: string, format: date-time, nullable: true }
        last_error:       { type: string, nullable: true }

    WebhookDelivery:
      type: object
      properties:
        id:            { type: integer }
        webhook_id:    { type: integer }
        event:         { $ref: '#/components/schemas/WebhookEventName' }
        status_code:   { type: integer, nullable: true }
        attempts:      { type: integer, description: "1-3. 1 = initial, 2/3 = Retries nach 15s/60s Backoff." }
        delivered_at:  { type: string, format: date-time, nullable: true }
        error:         { type: string, nullable: true }
        created_at:    { type: string, format: date-time }

    # ==== Event-Payloads (Bodies, die mastr-solar an deine Webhook-URL postet) ====
    WebhookEnvelope:
      type: object
      required: [event, timestamp, delivery_id, data]
      properties:
        event:       { $ref: '#/components/schemas/WebhookEventName' }
        timestamp:   { type: string, format: date-time }
        delivery_id: { type: string }
        data:        { type: object, description: "Event-spezifische Felder. Siehe events.* unten." }

    EventLeadCreated:
      type: object
      properties:
        lead_id:              { type: integer }
        lead_type:            { type: string, enum: [betreiber, partner, check] }
        interest:             { type: string, nullable: true }
        name:                 { type: string }
        firma:                { type: string, nullable: true }
        email:                { type: string, format: email }
        telefon:              { type: string, nullable: true }
        plz:                  { type: string, nullable: true }
        ort:                  { type: string, nullable: true }
        strasse:              { type: string, nullable: true }
        mastr_nummer:         { type: string, nullable: true }
        anlagen_leistung_kwp: { type: number, nullable: true }
        inbetriebnahme_jahr:  { type: integer, nullable: true }
        matched_anlage_id:    { type: integer, nullable: true }
        ticket:               { type: string, example: "LEAD-1234" }

    EventAnfrageReceived:
      allOf:
        - $ref: '#/components/schemas/EventLeadCreated'
        - type: object
          properties:
            matched_owner_id: { type: integer, nullable: true }
            zoho_status:      { type: string, description: "Zoho-Weiterleitungs-Status: ok / paused / error." }

    EventAnlageStatusChanged:
      type: object
      properties:
        anlage_id:    { type: integer }
        mastr_nummer: { type: string, nullable: true }
        old_status:   { type: string, nullable: true }
        new_status:   { type: string }
        changed_by:   { type: object, properties: { id: { type: integer }, username: { type: string } } }

    EventAnlageOwnerChanged:
      type: object
      properties:
        anlage_id:      { type: integer }
        old_owner_id:   { type: integer, nullable: true }
        new_owner_id:   { type: integer, nullable: true }
        new_owner_name: { type: string, nullable: true }
        changed_by:     { type: object, properties: { id: { type: integer }, username: { type: string } } }

    EventMentionCreated:
      type: object
      properties:
        anlage_id:    { type: integer }
        anlage_label: { type: string }
        from:         { type: object, properties: { id: { type: integer }, username: { type: string }, display_name: { type: string } } }
        to:           { type: object, properties: { id: { type: integer }, username: { type: string } } }
        text:         { type: string }
        channel:      { type: string, enum: [comment, note] }

    EventTerminCreated:
      type: object
      properties:
        termin_id:      { type: integer }
        uid:            { type: string }
        title:          { type: string }
        start:          { type: string, format: date-time }
        end:            { type: string, format: date-time }
        location:       { type: string, nullable: true }
        description:    { type: string, nullable: true }
        anlage_id:      { type: integer, nullable: true }
        attendee_email: { type: string, nullable: true }
        attendee_name:  { type: string, nullable: true }
        created_by:     { type: object, properties: { id: { type: integer }, username: { type: string } } }

    EventReminderDue:
      type: object
      properties:
        reminder_id:    { type: integer }
        betreiber_mastr: { type: string }
        betreiber_name: { type: string, nullable: true }
        owner_user_id:  { type: integer }
        due_at:         { type: string, format: date-time }
        note:           { type: string, nullable: true }

  parameters:
    XLocaleHeader:
      in: header
      name: X-Locale
      required: false
      schema: { type: string, enum: [de, en, fr] }
      description: |
        Sprache für Server-Fehlermeldungen (`error.*` und `srverr.*` aus Locale-Dateien).
        Fallback-Reihenfolge: X-Locale > Accept-Language > "de".
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, format: uuid }
      description: |
        Bei POST/PUT/PATCH: Wiederholungs-Schutz für 24 h. Gleicher Key + gleicher Body =
        gleiche Antwort. Gleicher Key + abweichender Body = HTTP 409 IDEMPOTENCY_KEY_REUSE.
